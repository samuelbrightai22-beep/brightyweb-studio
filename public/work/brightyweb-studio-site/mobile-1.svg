<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1200" width="600" height="1200" role="img" aria-label="Brightyweb studio homepage mobile view">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071629"/>
      <stop offset="100%" stop-color="#0E2A52"/>
    </linearGradient>
  </defs>
  <rect width="600" height="1200" rx="44" fill="#0A1828"/>
  <rect x="14" y="14" width="572" height="1172" rx="36" fill="url(#m-bg)"/>
  <rect x="240" y="34" width="120" height="22" rx="11" fill="#071629"/>
  <!-- header -->
  <text x="50" y="120" font-family="Georgia,serif" font-style="italic" font-size="26" fill="#F4EFE3">B</text>
  <text x="80" y="120" font-family="Inter,sans-serif" font-size="14" fill="#F4EFE3" letter-spacing="2">BRIGHTYWEB</text>
  <g transform="translate(500 100)">
    <rect x="0" y="0" width="40" height="32" rx="8" fill="#1B3A6B"/>
    <rect x="8" y="9" width="24" height="3" rx="1.5" fill="#F4EFE3"/>
    <rect x="8" y="15" width="24" height="3" rx="1.5" fill="#F4EFE3"/>
    <rect x="8" y="21" width="24" height="3" rx="1.5" fill="#F4EFE3"/>
  </g>
  <!-- eyebrow -->
  <text x="50" y="200" font-family="Inter,sans-serif" font-size="11" fill="#E8B23A" letter-spacing="3" font-weight="600">— ACCEPTING NEW PROJECTS</text>
  <!-- headline -->
  <text x="50" y="260" font-family="Inter,sans-serif" font-size="46" font-weight="500" fill="#F4EFE3" letter-spacing="-1.5">We design</text>
  <text x="50" y="316" font-family="Inter,sans-serif" font-size="46" font-weight="500" fill="#F4EFE3" letter-spacing="-1.5">websites</text>
  <text x="50" y="372" font-family="Inter,sans-serif" font-size="46" font-weight="500" fill="#F4EFE3" letter-spacing="-1.5">people </text>
  <text x="195" y="372" font-family="Georgia,serif" font-style="italic" font-size="46" fill="#E8B23A" letter-spacing="-1">remember.</text>
  <!-- supporting -->
  <text x="50" y="430" font-family="Inter,sans-serif" font-size="14" fill="#9FB1C7">Modern, responsive websites designed</text>
  <text x="50" y="452" font-family="Inter,sans-serif" font-size="14" fill="#9FB1C7">around your brand and your goals.</text>
  <!-- CTAs -->
  <rect x="50" y="500" width="220" height="54" rx="27" fill="#E8B23A"/>
  <text x="160" y="533" font-family="Inter,sans-serif" font-size="13" fill="#0A1828" font-weight="600" text-anchor="middle">VIEW MY WORK</text>
  <rect x="50" y="570" width="220" height="54" rx="27" fill="none" stroke="#F4EFE3" stroke-width="1.5"/>
  <text x="160" y="603" font-family="Inter,sans-serif" font-size="13" fill="#F4EFE3" font-weight="500" text-anchor="middle">START A PROJECT</text>
  <!-- pills -->
  <g font-family="Inter,sans-serif" font-size="12" fill="#9FB1C7">
    <text x="50" y="670">Fixed quotes</text>
    <text x="180" y="670">1–3 weeks</text>
    <text x="320" y="670">$11/year hosting</text>
  </g>
  <!-- mockup card -->
  <g transform="translate(50 720)">
    <rect x="0" y="0" width="500" height="380" rx="12" fill="#0A1828" stroke="#1B3A6B"/>
    <rect x="0" y="0" width="500" height="40" fill="#0E2A52"/>
    <circle cx="20" cy="20" r="5" fill="#1B3A6B"/>
    <circle cx="36" cy="20" r="5" fill="#E8B23A"/>
    <rect x="30" y="70" width="200" height="10" rx="5" fill="#1B3A6B"/>
    <rect x="30" y="90" width="160" height="8" rx="4" fill="#1B3A6B" opacity="0.6"/>
    <rect x="30" y="120" width="440" height="160" rx="8" fill="#0E2A52"/>
    <rect x="50" y="140" width="140" height="8" rx="4" fill="#E8B23A"/>
    <rect x="50" y="160" width="120" height="6" rx="3" fill="#5C7290"/>
    <rect x="50" y="180" width="100" height="32" rx="16" fill="#E8B23A"/>
    <rect x="290" y="140" width="160" height="120" rx="6" fill="#071629"/>
    <rect x="310" y="160" width="120" height="8" rx="4" fill="#E8B23A" opacity="0.7"/>
    <rect x="30" y="305" width="220" height="50" rx="8" fill="#0E2A52"/>
    <rect x="50" y="322" width="120" height="6" rx="3" fill="#1B3A6B"/>
  </g>
  <!-- bottom nav -->
  <rect x="50" y="1140" width="500" height="40" rx="20" fill="#0A1828"/>
  <g font-family="Inter,sans-serif" font-size="11" fill="#9FB1C7" letter-spacing="2">
    <text x="115" y="1165">HOME</text>
    <text x="215" y="1165">WORK</text>
    <text x="320" y="1165">SERVICES</text>
    <text x="445" y="1165">CONTACT</text>
  </g>
</svg>
