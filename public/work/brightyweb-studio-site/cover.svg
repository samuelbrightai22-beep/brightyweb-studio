<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Brightyweb studio homepage preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071629"/>
      <stop offset="100%" stop-color="#0E2A52"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2D079"/>
      <stop offset="100%" stop-color="#E8B23A"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1600" height="72" fill="#0A1828" opacity="0.6"/>
  <text x="60" y="48" font-family="Georgia,serif" font-size="28" fill="#F4EFE3" font-style="italic">B</text>
  <text x="95" y="48" font-family="Inter,sans-serif" font-size="18" fill="#F4EFE3" letter-spacing="2">BRIGHTYWEB</text>
  <g font-family="Inter,sans-serif" font-size="14" fill="#9FB1C7" letter-spacing="2">
    <text x="980" y="48">HOME</text>
    <text x="1080" y="48">ABOUT</text>
    <text x="1180" y="48">SERVICES</text>
    <text x="1300" y="48">WORK</text>
    <text x="1380" y="48">CONTACT</text>
  </g>
  <rect x="1470" y="28" width="100" height="32" rx="16" fill="url(#gold)"/>
  <text x="1520" y="50" font-family="Inter,sans-serif" font-size="13" fill="#0A1828" font-weight="600" text-anchor="middle">START A PROJECT</text>

  <!-- eyebrow -->
  <text x="60" y="180" font-family="Inter,sans-serif" font-size="13" fill="#E8B23A" letter-spacing="3" font-weight="600">— ACCEPTING NEW PROJECTS</text>

  <!-- big headline -->
  <text x="60" y="280" font-family="Inter,sans-serif" font-size="84" font-weight="500" fill="#F4EFE3" letter-spacing="-2">We design websites</text>
  <text x="60" y="375" font-family="Inter,sans-serif" font-size="84" font-weight="500" fill="#F4EFE3" letter-spacing="-2">people </text>
  <text x="280" y="375" font-family="Georgia,serif" font-style="italic" font-size="84" fill="#E8B23A" letter-spacing="-1">remember.</text>

  <!-- supporting copy -->
  <text x="60" y="460" font-family="Inter,sans-serif" font-size="20" fill="#9FB1C7" letter-spacing="-0.2">Modern, responsive websites designed around your brand,</text>
  <text x="60" y="490" font-family="Inter,sans-serif" font-size="20" fill="#9FB1C7" letter-spacing="-0.2">your audience and your goals.</text>

  <!-- CTAs -->
  <rect x="60" y="540" width="200" height="56" rx="28" fill="url(#gold)"/>
  <text x="160" y="574" font-family="Inter,sans-serif" font-size="15" fill="#0A1828" font-weight="600" text-anchor="middle">VIEW MY WORK</text>
  <rect x="280" y="540" width="200" height="56" rx="28" fill="none" stroke="#F4EFE3" stroke-width="1.5"/>
  <text x="380" y="574" font-family="Inter,sans-serif" font-size="15" fill="#F4EFE3" font-weight="500" text-anchor="middle">START A PROJECT</text>

  <!-- trust pills -->
  <g font-family="Inter,sans-serif" font-size="13" fill="#9FB1C7">
    <text x="60" y="650">Fixed quotes</text>
    <text x="220" y="650">Launch in 1–3 weeks</text>
    <text x="430" y="650">Deployed from $11/year</text>
  </g>

  <!-- floating mockup card on right -->
  <g transform="translate(900 180)">
    <rect x="0" y="0" width="640" height="540" rx="14" fill="#0A1828" stroke="#1B3A6B"/>
    <rect x="0" y="0" width="640" height="46" rx="14" fill="#0E2A52"/>
    <circle cx="22" cy="23" r="6" fill="#1B3A6B"/>
    <circle cx="42" cy="23" r="6" fill="#1B3A6B"/>
    <circle cx="62" cy="23" r="6" fill="#E8B23A"/>
    <rect x="160" y="14" width="320" height="18" rx="9" fill="#071629"/>
    <text x="320" y="28" font-family="Inter,sans-serif" font-size="11" fill="#5C7290" text-anchor="middle">https://brightyweb.space-z.ai</text>
    <!-- mock content -->
    <rect x="40" y="80" width="280" height="14" rx="7" fill="#1B3A6B"/>
    <rect x="40" y="106" width="220" height="14" rx="7" fill="#1B3A6B" opacity="0.6"/>
    <rect x="40" y="150" width="560" height="200" rx="10" fill="#0E2A52"/>
    <rect x="60" y="170" width="200" height="10" rx="5" fill="#E8B23A"/>
    <rect x="60" y="190" width="160" height="8" rx="4" fill="#5C7290"/>
    <rect x="60" y="208" width="180" height="8" rx="4" fill="#5C7290" opacity="0.6"/>
    <rect x="60" y="240" width="100" height="40" rx="20" fill="#E8B23A"/>
    <rect x="60" y="300" width="260" height="80" rx="8" fill="#071629"/>
    <rect x="340" y="170" width="240" height="160" rx="8" fill="#071629"/>
    <rect x="360" y="190" width="180" height="10" rx="5" fill="#E8B23A" opacity="0.7"/>
    <rect x="360" y="210" width="140" height="8" rx="4" fill="#5C7290"/>
    <rect x="40" y="380" width="560" height="120" rx="8" fill="#0E2A52"/>
    <rect x="60" y="400" width="160" height="10" rx="5" fill="#E8B23A"/>
    <rect x="60" y="420" width="120" height="8" rx="4" fill="#5C7290"/>
    <rect x="60" y="450" width="100" height="36" rx="18" fill="#1B3A6B"/>
  </g>

  <!-- bottom marquee line -->
  <rect x="0" y="940" width="1600" height="60" fill="#0A1828"/>
  <text x="800" y="978" font-family="Inter,sans-serif" font-size="14" fill="#9FB1C7" letter-spacing="6" text-anchor="middle">WEB DESIGN STUDIO — DEPLOYED FROM $11/YEAR — FIXED QUOTES — LAUNCH IN 1–3 WEEKS</text>
